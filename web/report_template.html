<script>

const D = /*__DATA__*/null;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

let sync=true,skeleton=true,view="2d",speed=1,manualRef=null,edit=false,editRole="user",editPosition="BOTTOM",graphMetric;

const positions = () => W.meta.positions;
const userRep = () => W.user.reps.find(r=>r.rep===W.reps[curRep].rep);

const colorHex = c => c==="red"?"#D93F3F":c==="yellow"?"#E3A008":"#eeeef2";
const metrics = () => Object.keys(W.meta.metric_labels);
const fmt = (v,unit="deg") => v===null||v===undefined?"—":unit==="ratio"?(v*W.meta.rules.ratio_percent_scale).toFixed(1)+"%":unit==="s"?v.toFixed(2)+"초":v.toFixed(1)+"°";
const signed = (v,unit) => v===null||v===undefined?"—":(v<0?"−":v>0?"+":"")+fmt(Math.abs(v),unit);
let pose3dView=null;
const pose3dProfileCache=new WeakMap();

function progressAt(frame,points,names){
  if(frame<=points[names[0]]) return 0;
  for(let i=0;i<names.length-1;i++){
    if(frame<=points[names[i+1]]) return i+(frame-points[names[i]])/(points[names[i+1]]-points[names[i]]);
  }
  return names.length-1;
}
function frameAt(progress,points,names){
  const p=clamp(progress,0,names.length-1),i=Math.min(Math.floor(p),names.length-2);
  return Math.round(points[names[i]]+(p-i)*(points[names[i+1]]-points[names[i]]));
}
function referenceFrame(frame,ur,rr,names,userFps,refFps,synchronized){
  const first=names[0],last=names[names.length-1];
  if(!synchronized) return clamp(Math.round(rr.positions[first]+(frame-ur.positions[first])*refFps/userFps),rr.positions[first],rr.positions[last]);
  if(frame<ur.phases.down[0]||frame>=ur.phases.up[1]) return rr.positions[first];
  return frameAt(progressAt(frame,ur.positions,names),rr.positions,names);
}
function mappedRefFrame(){
  return manualRef ?? referenceFrame(curFrame,userRep(),referenceRep(),positions(),W.user.fps,W.ref.fps,sync);
}
function pose3dMeta(report=W){
  const meta=report?.meta?.pose3d||{};
  return {parents:Array.isArray(meta.parents)?meta.parents:[],metric_joints:meta.metric_joints||{},labels:meta.labels||{},roles:meta.roles||{}};
}
function pose3dValidate(data,total){
  return !!(data&&data.joints==="h36m17"&&Array.isArray(data.frames)&&
    (total===undefined||Number(data.total)===Number(total))&&
    (total===undefined||data.frames.length===Number(total)));
}
function pose3dDisplayFrame(data,frame,{mirror=false}={}){
  if(!pose3dValidate(data)||!Number.isInteger(frame)||frame<0||frame>=data.frames.length)return null;
  const raw=data.frames[frame];
  if(!Array.isArray(raw)||raw.length<17)return null;
  const points=raw.map(p=>{
    if(!Array.isArray(p)||p.length<3||!p.every(Number.isFinite))return null;
    const x=mirror?-p[0]:p[0];
    return [x,-p[1],-p[2]];
  });
  if(points.some(p=>p===null))return null;
  const ankles=[points[3],points[6]].filter(Boolean);
  const floor=ankles.length?Math.min(...ankles.map(p=>p[1])):Math.min(...points.map(p=>p[1]));
  return points.map(p=>[p[0],p[1]-floor,p[2]]);
}
function pose3dMedian(values){
  if(!values.length)return 0;
  const sorted=[...values].sort((a,b)=>a-b),middle=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2;
}
function pose3dBoneProfile(data,parents=pose3dMeta().parents){
  if(!pose3dValidate(data))return {lengths:[],torsoLength:0};
  const key=parents.join(","),cached=pose3dProfileCache.get(data);
  if(cached?.frames===data.frames&&cached.key===key)return cached.profile;
  const samples=parents.map(()=>[]),torsos=[];
  for(const points of data.frames){
    if(!Array.isArray(points)||points.length<17||points.some(p=>!Array.isArray(p)||p.length<3||!p.every(Number.isFinite)))continue;
    for(let i=0;i<parents.length;i++){
      const parent=parents[i];if(parent<0)continue;
      samples[i].push(Math.hypot(...points[i].slice(0,3).map((v,axis)=>v-points[parent][axis])));
    }
    torsos.push(Math.hypot(...points[8].slice(0,3).map((v,axis)=>v-points[0][axis])));
  }
  const profile={lengths:samples.map(pose3dMedian),torsoLength:pose3dMedian(torsos),units:data.units||data.unit};

}
function pose3dFixedBones(points,profile,parents){
  if(!points)return null;
  const fixed=Array(points.length).fill(null),queue=[];
  for(let i=0;i<parents.length;i++)if(parents[i]<0){fixed[i]=points[i]?[...points[i]]:null;queue.push(i);}
  for(let cursor=0;cursor<queue.length;cursor++){
    const parent=queue[cursor];
    for(let i=0;i<parents.length;i++)if(parents[i]===parent){
      if(points[i]&&points[parent]&&fixed[parent]){
        const direction=points[i].map((v,axis)=>v-points[parent][axis]),length=Math.hypot(...direction),target=profile.lengths[i];
        if(Number.isFinite(target)&&target>=0&&(length>0||target===0))

    }

}
function pose3dRobotFrame(data,frame,options={},parents=pose3dMeta().parents){
  const points=pose3dDisplayFrame(data,frame,options);
  if(!points)return null;
  const fixed=pose3dFixedBones(points,pose3dBoneProfile(data,parents),parents);
  if(!fixed||fixed.some(p=>!p))return null;
  const floor=Math.min(fixed[3][1],fixed[6][1]);
  return fixed.map(p=>[p[0],p[1]-floor,p[2]]);
}
function pose3dMannequinSpec(profile){
  const scale=1.55,unit=profile?.units==="m"?1:(profile?.torsoLength||.5)/.5,factor=unit*scale;
  return {scale,headRadius:.10*factor,torsoRadius:.13*factor,thighRadius:.075*factor,
    shinRadius:.055*factor,upperArmRadius:.045*factor,forearmRadius:.04*factor,
    jointRadius:.05*factor,neckRadius:.025*factor,hipRadius:.09*factor,shoulderRadius:.07*factor};

function pose3dRepScenePoints(report,poses,userSegment,refSegment){
  const points=[],parents=pose3dMeta(report).parents;
  for(const [role,segment,offset] of [["user",userSegment,-.55],["ref",refSegment,.55]]){
    const data=poses?.[role];if(!segment||!pose3dValidate(data,report[role].total))continue;
    const start=Math.max(0,Math.min(segment.positions.START,segment.phases?.down?.[0]??segment.positions.START));
    const end=Math.min(data.frames.length-1,Math.max(segment.positions.LOCKOUT,(segment.phases?.up?.[1]??segment.positions.LOCKOUT+1)-1));
    const spec=pose3dMannequinSpec(pose3dBoneProfile(data,parents)),options={mirror:role==="ref"&&report.ref.mirror};
    for(let frame=start;frame<=end;frame++){
      const raw=pose3dScenePoints(pose3dDisplayFrame(data,frame,options),offset);
      const robot=parents.length?pose3dScenePoints(pose3dRobotFrame(data,frame,options,parents),offset):null;
      for(const [shape,radius] of [[raw,.06],[robot,Math.max(spec.headRadius,spec.torsoRadius,spec.thighRadius*1.1)]]){
        if(!shape)continue;
        for(const p of shape)points.push(p,p.map(v=>v-radius),p.map(v=>v+radius));

function pose3dGoalJoints(report,finding,role,userSegment,refSegment){
  const goal=finding?.goal;
  if(!goal||goal.type==="none")return [];
  const side=(role==="ref"?refSegment:userSegment)?.side||"left";
  const mapping=pose3dMeta(report).metric_joints;
  return [...new Set((goal.metrics||[goal.metric]).flatMap(metric=>mapping[metric]?.[side]||[]))];

function pose3dFrameIndices(report,userFrame,refFrameValue){
  return {user:clamp(Math.round(userFrame),0,report.user.total-1),

}
function pose3dCameraPreset(name,distance=3){
  const presets={side:[distance,1.35,0],front:[0,1.35,distance],top:[0,distance+.8,.01],back:[0,1.35,-distance]};
  return presets[name]||presets.side;

function pose3dScenePoints(points,offset=0,scale=1.55){
  if(!points)return null;

function pose3dOffsetPoints(points,offset=0){
  return points?points.map(p=>[p[0]+offset,p[1],p[2]]):null;
}
function pose3dBounds(points){
  const finite=(points||[]).filter(p=>p&&p.every(Number.isFinite));
  if(!finite.length)return null;
  const mins=[0,1,2].map(axis=>Math.min(...finite.map(p=>p[axis])));

function pose3dFitCamera(points,{aspect=1,fov=45,preset="side",margin=1.45}={}){

  const vertical=bounds.size[1],horizontal=preset==="side"?bounds.size[2]:bounds.size[0];

function contentRect(box,source){

  return {x:(width-source.size[0]*scale)/2,y:(height-source.size[1]*scale)/2,w:source.size[0]*scale,h:source.size[1]*scale};
}
function goalJoints(role){
  const g=currentFinding().goal;if(!g||g.type==="none") return [];
  const side=role==="user"?userRep().side:referenceRep().side;
  return [...new Set((g.metrics||[g.metric]).flatMap(m=>W.metric_joints[m]?.[side]||[]))];
}
function paint(cv,ctx,pts,joints,color,mirror=false,transform=null){
  if(!cv) return;
  const box=cv.parentElement,r=contentRect(box,cv===uc?W.user:W.ref),ratio=window.devicePixelRatio||1;
  if(cv.width!==Math.round(box.clientWidth*ratio)||cv.height!==Math.round(box.clientHeight*ratio)){
    cv.width=Math.round(box.clientWidth*ratio);cv.height=Math.round(box.clientHeight*ratio);

    return transform?transform(p):[r.x+p[0]*r.w,r.y+p[1]*r.h];};
  const visible=i=>pts[i]&&pts[i][2]>=.5&&Number.isFinite(pts[i][0])&&Number.isFinite(pts[i][1]);
  ctx.save();if(transform)ctx.globalAlpha=.55;
  for(const [a,b] of W.connections){

function positionMedian(series,frame,rules){

  if(samples.length<rules.min_position_values)return null;
  const middle=Math.floor(samples.length/2);
  return samples.length%2?samples[middle]:(samples[middle-1]+samples[middle])/2;
}
function applyPositionEdit(report,role,repNumber,position,frame){
  const source=report[role],segment=source.reps.find(r=>r.rep===repNumber),names=report.meta.positions,rules=report.meta.rules;
  const index=names.indexOf(position);
  if(!segment||index<0||!Number.isInteger(frame))return {ok:false,reason:"포지션 또는 프레임을 찾을 수 없습니다."};
  const lo=Math.max(0,segment.phases.down[0]-rules.frame_padding),hi=Math.min(source.total,segment.phases.up[1]+rules.frame_padding);
  if(frame<lo||frame>=hi)return {ok:false,reason:"수정 범위: "+lo+"–"+(hi-1)+" 프레임"};
  if((index>0&&frame<=segment.positions[names[index-1]])||(index<names.length-1&&frame>=segment.positions[names[index+1]]))
    return {ok:false,reason:"포지션 순서를 유지하는 프레임만 선택할 수 있습니다."};
  segment.positions[position]=frame;

  for(const finding of affected){
    const userSegment=report.user.reps.find(r=>r.rep===finding.rep);
    for(const cell of finding.cells.filter(c=>c.where===position)){
      const user=positionMedian(report.user.frame_metrics[cell.metric],userSegment.positions[position],rules);
      const ref=positionMedian(report.ref.frame_metrics[cell.metric],refSegment.positions[position],rules);
      Object.assign(cell,compareCell(user,ref,report.meta.thresholds[cell.metric],cell.unit,report.meta.advisory_metrics.includes(cell.metric),rules));
    }
    const goal=finding.goal;
    if(goal){
      goal.evidence=(goal.evidence||[]).map(e=>({...finding.cells.find(c=>c.where===e.where&&c.metric===e.metric)}));
      if(goal.type!=="none"){
        goal.frame=userSegment.positions[goal.where];goal.ref_frame=refSegment.positions[goal.where];
        const targetMetrics=goal.metrics||[goal.metric],targets=finding.cells.filter(c=>c.where===goal.where&&targetMetrics.includes(c.metric)&&c.k!==null);
        if(targets.length){const largest=targets.reduce((a,b)=>b.k>a.k?b:a);goal.k=largest.k;goal.color=largest.color;}
        else {goal.k=null;goal.color="none";}

  }

    '<div class="tl"><div class="position-lane" id="position-lane"></div><div class="bands" id="bands" role="slider" tabindex="0" aria-label="영상 프레임"></div></div>'+
    '<div class="legend">'+Object.entries(W.meta.phase_labels).map(([p,label])=>'<span><i style="background:var(--'+p+')"></i>'+esc(label)+'</span>').join("")+'</div>'+
    '<div class="controls" id="positions">'+positions().map(p=>'<button data-position-button="'+p+'">'+esc(W.meta.position_labels[p])+'</button>').join("")+'</div>'+
    '<div class="controls"><button id="prev" aria-label="이전 프레임">−1</button><button id="play">▶ 재생</button><button id="next" aria-label="다음 프레임">+1</button>'+
    '<label>속도 <select id="speed" aria-label="재생 속도"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select></label>'+
    '<button id="sync" aria-pressed="true">동기화 켜짐</button><label>보기 <select id="view"><option value="2d">2D</option><option value="overlay">겹쳐</option><option value="3d">3D</option></select></label>'+
    '<button id="skeleton" aria-pressed="true">스켈레톤 켜짐</button><button id="edit" aria-pressed="false">수정</button><span class="frame-no">사용자 <b id="user-frame"></b> / ref <b id="ref-frame"></b></span></div>'+
    '<div class="edit-bar" id="edit-bar"><div class="edit-row"><label>포지션 대상 <select id="edit-role"><option value="user">사용자</option><option value="ref">레퍼런스</option></select></label><button id="undo">되돌리기</button><button id="save">저장 (JSON)</button></div><div class="edit-status" id="edit-status"></div></div>'+
    '<div class="notice" id="notice" role="status" hidden></div></section><aside class="side" id="side"></aside></div>'+
    '<footer class="foot"><kbd>Space</kbd> 재생 / 정지 · <kbd>←</kbd> <kbd>→</kbd> 1프레임 · <kbd>Shift</kbd> + 방향키 10프레임 (수정 중 5프레임) · <kbd>1</kbd>–<kbd>5</kbd> 포지션 · <kbd>[</kbd> <kbd>]</kbd> rep</footer>';
  uv=document.getElementById("uv");uv.src=W.user.video.split("/").map(encodeURIComponent).join("/");
  uc=document.getElementById("uc");ec=document.getElementById("ec");ux=uc.getContext("2d");ex_=ec.getContext("2d");esp=document.getElementById("esp");
  if(W.ref.sprite){esp.style.backgroundImage='url("'+W.ref.sprite.data+'")';esp.style.backgroundSize=W.ref.sprite.cols*100+'% '+W.ref.sprite.rows*100+'%';}
  else {esp.textContent="레퍼런스 프레임 이미지 없음";showNotice("레퍼런스 스프라이트를 만들 수 없습니다.");}
  uv.addEventListener("loadedmetadata",()=>seek(userRep().positions.START,referenceRep().positions.START));
  uv.addEventListener("loadeddata",diagnose);uv.addEventListener("error",()=>showNotice("사용자 영상 파일 또는 코덱을 열 수 없습니다: "+W.user.video));
  uv.addEventListener("seeked",drawFrame);uv.addEventListener("pause",drawFrame);uv.addEventListener("play",drawFrame);uv.addEventListener("ended",drawFrame);
  document.querySelectorAll(".reptabs button").forEach(b=>b.onclick=()=>selectRep(+b.dataset.index));
  document.getElementById("positions").onclick=e=>{const b=e.target.closest("[data-position-button]");if(b)positionSeek(b.dataset.positionButton);};
  document.getElementById("position-lane").onclick=e=>{const b=e.target.closest("[data-position]");if(b){selectRep(W.reps.findIndex(r=>r.rep===+b.dataset.rep));positionSeek(b.dataset.position);}};
  document.getElementById("bands").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seek(Math.round((e.clientX-r.left)/r.width*(total-1)));};
  document.getElementById("prev").onclick=()=>moveFrame(-1);document.getElementById("next").onclick=()=>moveFrame(1);document.getElementById("play").onclick=togglePlay;
  document.getElementById("speed").onchange=e=>{speed=+e.target.value;uv.playbackRate=speed;};
  document.getElementById("sync").onclick=()=>{sync=!sync;manualRef=null;updateControls();drawFrame();};
  document.getElementById("skeleton").onclick=()=>{skeleton=!skeleton;updateControls();drawFrame();};
  document.getElementById("view").onchange=e=>{view=e.target.value;document.getElementById("video-section").className="view-"+view;if(view==="3d")initPose3d();drawFrame();};
  document.getElementById("edit").onclick=()=>{edit=!edit;pause();updateControls();updateEditStatus();};
  document.getElementById("edit-role").onchange=e=>{editRole=e.target.value;positionSeek(editPosition);};
  document.getElementById("undo").onclick=resetPositions;document.getElementById("save").onclick=savePositions;
  document.addEventListener("keydown",keydown);
  new ResizeObserver(()=>{fitTempoLabels();drawFrame();}).observe(document.getElementById("side"));
  new ResizeObserver(()=>drawFrame()).observe(document.getElementById("video-section"));
  renderTimeline();seek(userRep().positions.START,referenceRep().positions.START);updateControls();renderRep();requestAnimationFrame(tick);
}
globalThis.ReportMath={progressAt,frameAt,referenceFrame,compareCell,positionMedian,applyPositionEdit,positionChanges};
globalThis.Report3D={displayFrame:pose3dDisplayFrame,validate:pose3dValidate,goalJoints:pose3dGoalJoints,frameIndices:pose3dFrameIndices,cameraPreset:pose3dCameraPreset,
  boneProfile:pose3dBoneProfile,fixedBones:pose3dFixedBones,robotFrame:pose3dRobotFrame,mannequinSpec:pose3dMannequinSpec,repScenePoints:pose3dRepScenePoints,
  scenePoints:pose3dScenePoints,offsetPoints:pose3dOffsetPoints,bounds:pose3dBounds,fitCamera:pose3dFitCamera,
  debug:()=>pose3dView?{...pose3dView.last,style:pose3dView.style,preset:pose3dView.preset,target:pose3dView.target,
    distance:pose3dView.drag?.distance,fit:pose3dView.fit,fitKey:pose3dView.fitKey,fitCount:pose3dView.fitCount,
    camera:[pose3dView.camera.position.x,pose3dView.camera.position.y,pose3dView.camera.position.z],
    message:pose3dView.message?.textContent,hidden:pose3dView.message?.hidden}:null};
if(typeof document!=="undefined")build();
</script>
